# Subfinder provider configuration
# ==========================================
# 1️⃣ Remove the '#' to enable a source
# 2️⃣ Replace YOUR_API_KEY with your actual key
# 3️⃣ Run setup_subfinder_keys.sh for guided setup
#
# Free API signup URLs (no credit card needed):
#   SecurityTrails  → https://securitytrails.com
#   AlienVault OTX  → https://otx.alienvault.com
#   URLScan.io      → https://urlscan.io
#   VirusTotal      → https://virustotal.com
#   Shodan          → https://shodan.io
#   GitHub          → https://github.com (PAT with no scopes)
# ==========================================

# --- Keyless sources (work without keys) ---
crtsh: []
digitorus: []
hudsonrock: []
