# Capability catalog — the vocabulary of the investigation engine.
#
# The reasoning loop (planner + LLM) works exclusively in these identifiers.
# Tools advertise which capabilities they can fulfil (see tools.yaml);
# the Capability Resolver maps a required capability to a concrete tool.
#
# Adding a capability requires ONLY this file (new key) + assigning registers
# in a tool's `capabilities` list. No planner / prompt / reasoning changes.
#
# Fields:
#   description   — what the capability produces, for prompt/schema context
#   category      — coarse grouping (discovery | fingerprint | audit | attack)
#   default_cost  — relative execution cost 0..1 used when heuristics have no
#                   tool-specific figure
#   default_risk  — approval tier for a generic implementation (passive |
#                   active_scan | exploit); tools may override per-instance
#   default_gain  — expected information gain 0..1 for scoring fallback
#   phase         — natural investigation phase this capability serves

network_discovery:
  description: "Discover the network surface: reachable hosts, open ports and running services"
  category: discovery
  default_cost: 0.2
  default_risk: passive
  default_gain: 0.9
  phase: recon

